name: Explicit historical oracle verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trinity-history-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node verify.mjs --read-public-history
